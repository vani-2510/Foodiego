<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodieGo | Login</title>

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: Arial, Helvetica, sans-serif;
	background: #19191f;
	color: #fff;
	min-height: 100vh;
	display: flex;
	flex-direction: column;
}

/* Navbar */
.navbar {
	background: #222128;
	padding: 20px 8%;
	display: flex;
	justify-content: space-between;
	align-items: center;
}

.logo {
	font-size: 27px;
	font-weight: bold;
	color: #ff386b;
}

.nav-links a {
	color: #fff;
	text-decoration: none;
	margin-left: 25px;
	font-size: 15px;
	transition: color 0.3s;
}

.nav-links a:hover {
	color: #ff386b;
}

/* Login Section */
.login-section {
	flex: 1;
	display: flex;
	justify-content: center;
	align-items: center;
	padding: 40px 20px;
}

.login-card {
	background: #24242d;
	width: 100%;
	max-width: 420px;
	padding: 40px 35px;
	border-radius: 16px;
	border: 1px solid #353541;
	box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
}

.login-card h1 {
	text-align: center;
	font-size: 30px;
	margin-bottom: 10px;
}

.subtitle {
	text-align: center;
	color: #b4b4c2;
	font-size: 14px;
	margin-bottom: 30px;
}

.form-group {
	margin-bottom: 22px;
}

.form-group label {
	display: block;
	margin-bottom: 9px;
	font-size: 14px;
	font-weight: bold;
}

.form-group input {
	width: 100%;
	padding: 13px 14px;
	background: #19191f;
	color: #fff;
	border: 1px solid #41414d;
	border-radius: 8px;
	outline: none;
	font-size: 15px;
}

.form-group input:focus {
	border-color: #ff386b;
	box-shadow: 0 0 0 2px rgba(255, 56, 107, 0.15);
}

.form-group input::placeholder {
	color: #858594;
}

.login-btn {
	width: 100%;
	padding: 14px;
	background: #ff386b;
	color: #fff;
	border: none;
	border-radius: 8px;
	font-size: 16px;
	font-weight: bold;
	cursor: pointer;
	transition: background 0.3s;
}

.login-btn:hover {
	background: #e62959;
}

.register-link {
	text-align: center;
	margin-top: 25px;
	color: #b4b4c2;
	font-size: 14px;
}

.register-link a {
	color: #ff386b;
	text-decoration: none;
	font-weight: bold;
}

.register-link a:hover {
	text-decoration: underline;
}

/* Footer */
footer {
	text-align: center;
	padding: 20px;
	color: #b4b4c2;
	font-size: 13px;
	background: #222128;
}

@media ( max-width : 480px) {
	.navbar {
		padding: 18px 5%;
	}
	.logo {
		font-size: 23px;
	}
	.nav-links a {
		margin-left: 12px;
		font-size: 13px;
	}
	.login-card {
		padding: 30px 22px;
	}
}
</style>
</head>

<body>

	<nav class="navbar">
		<div class="logo">FoodieGo</div>

		<div class="nav-links">
			<a href="index.jsp">Home</a> <a href="register.html">Register</a>
		</div>
	</nav>

	<main class="login-section">
		<div class="login-card">
			<h1>Welcome Back!</h1>
			<p class="subtitle">Login to your FoodieGo account</p>

			<form action="callLoginServlet" method="post" autocomplete="off">

				<div class="form-group">
					<label for="username">Email Address</label> <input type="email"
						id="username" name="username"
						placeholder="Enter your email address" autocomplete="off" required>
				</div>

				<div class="form-group">
					<label for="password">Password</label> <input type="password"
						id="password" name="password" placeholder="Enter your password"
						autocomplete="off" required>
				</div>

				<button type="submit" class="login-btn">Login</button>
			</form>

			<p class="register-link">
				Don't have an account? <a href="register.html">Create Account</a>
			</p>
		</div>
	</main>

	<footer> &copy; 2026 FoodieGo. All rights reserved. </footer>

</body>
</html>
