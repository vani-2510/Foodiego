
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodieGo | Register</title>

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

:root {
	--background: #19191f;
	--surface: #24242d;
	--pink: #ff386b;
	--text: #ffffff;
	--muted: #b4b4c2;
	--border: #41414c;
}

body {
	font-family: Arial, Helvetica, sans-serif;
	background: var(--background);
	color: var(--text);
	min-height: 100vh;
}

a {
	color: inherit;
	text-decoration: none;
}

/* Navigation */
.navbar {
	min-height: 75px;
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 0 7%;
	background: #222128;
	border-bottom: 1px solid #33333b;
}

.logo {
	font-size: 28px;
	font-weight: 800;
	color: var(--pink);
}

.nav-links {
	display: flex;
	align-items: center;
	gap: 30px;
}

.nav-links a {
	font-size: 15px;
	color: #eeeeF4;
	transition: color 0.2s;
}

.nav-links a:hover, .nav-links .active {
	color: var(--pink);
}

/* Registration background */
.page-container {
	min-height: calc(100vh - 75px);
	display: flex;
	justify-content: center;
	align-items: center;
	padding: 45px 20px;
	background: linear-gradient(rgba(15, 15, 20, 0.82),
		rgba(15, 15, 20, 0.90)),
		url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1800&q=85")
		center/cover no-repeat;
}

/* Registration card */
.register-card {
	width: 100%;
	max-width: 510px;
	padding: 38px;
	background: rgba(36, 36, 45, 0.97);
	border: 1px solid #393943;
	border-radius: 16px;
	box-shadow: 0 18px 50px rgba(0, 0, 0, 0.40);
}

.register-heading {
	text-align: center;
	margin-bottom: 30px;
}

.register-heading h1 {
	font-size: 32px;
	margin-bottom: 10px;
}

.register-heading h1 span {
	color: var(--pink);
}

.register-heading p {
	color: var(--muted);
	font-size: 14px;
	line-height: 1.6;
}

/* Form fields */
.form-group {
	margin-bottom: 19px;
}

.form-group label {
	display: block;
	margin-bottom: 9px;
	font-size: 14px;
	font-weight: bold;
	color: #eeeeF4;
}

.form-group input, .form-group select, .form-group textarea {
	width: 100%;
	padding: 14px 15px;
	border: 1px solid var(--border);
	border-radius: 8px;
	outline: none;
	background: #19191f;
	color: var(--text);
	font-family: inherit;
	font-size: 15px;
	transition: border-color 0.2s, box-shadow 0.2s;
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus
	{
	border-color: var(--pink);
	box-shadow: 0 0 0 3px rgba(255, 56, 107, 0.12);
}

.form-group input::placeholder, .form-group textarea::placeholder {
	color: #858593;
}

.form-group textarea {
	resize: vertical;
	min-height: 90px;
}

.form-group select {
	cursor: pointer;
}

.form-group select option {
	background: #24242d;
	color: white;
}

/* Password eye icon */
.password-wrapper {
	position: relative;
	width: 100%;
}

.password-wrapper input {
	padding-right: 50px;
}

.toggle-password {
	position: absolute;
	right: 14px;
	top: 50%;
	transform: translateY(-50%);
	display: flex;
	align-items: center;
	justify-content: center;
	background: transparent;
	border: none;
	color: #b4b4c2;
	cursor: pointer;
	padding: 5px;
	font-size: 20px;
	transition: color 0.2s;
}

.toggle-password:hover {
	color: var(--pink);
}

.toggle-password:focus {
	outline: 2px solid var(--pink);
	outline-offset: 2px;
	border-radius: 4px;
}

/* Register button */
.register-btn {
	width: 100%;
	padding: 15px;
	margin-top: 5px;
	border: none;
	border-radius: 8px;
	background: var(--pink);
	color: white;
	font-size: 16px;
	font-weight: bold;
	cursor: pointer;
	transition: background 0.2s, transform 0.2s;
}

.register-btn:hover {
	background: #e9275b;
	transform: translateY(-1px);
}

.login-link {
	text-align: center;
	margin-top: 24px;
	font-size: 14px;
	color: var(--muted);
}

.login-link a {
	color: var(--pink);
	font-weight: bold;
}

.login-link a:hover {
	text-decoration: underline;
}

footer {
	padding: 20px;
	text-align: center;
	background: #222128;
	color: var(--muted);
	font-size: 13px;
}

footer span {
	color: var(--pink);
}

/* Responsive design */
@media ( max-width : 600px) {
	.navbar {
		padding: 18px 5%;
		align-items: flex-start;
		flex-direction: column;
		gap: 15px;
	}
	.nav-links {
		gap: 18px;
		flex-wrap: wrap;
	}
	.page-container {
		padding: 30px 15px;
	}
	.register-card {
		padding: 26px 21px;
	}
	.register-heading h1 {
		font-size: 27px;
	}
}
</style>
</head>

<body>

	<!-- Navigation -->
	<header class="navbar">

		<a href="index.jsp" class="logo">FoodieGo</a>

		<nav class="nav-links">
			<a href="index.jsp">Home</a> <a href="callRestaurantServlet">Restaurants</a>
			<a href="login.html">Login</a> <a href="register.html" class="active">Register</a>
		</nav>

	</header>

	<!-- Registration form -->
	<main class="page-container">

		<section class="register-card">

			<div class="register-heading">

				<h1>
					Create Your <span>Account</span>
				</h1>

				<p>Join FoodieGo and enjoy your favorite meals.</p>

			</div>

			<p id="registerMessage"
				style="text-align: center; margin-bottom: 18px; color: #ff386b;">
			</p>

			<!-- Registration error messages -->
			<form action="callRegisterServlet" method="post">

				<div class="form-group">

					<label for="name">Full Name</label> <input type="text" id="name"
						name="name" placeholder="Enter your full name" autocomplete="name"
						required>

				</div>

				<div class="form-group">

					<label for="email">Email Address</label> <input type="email"
						id="email" name="email" placeholder="Enter your email address"
						autocomplete="email" required>

				</div>

				<!-- Phone Number -->
				<div class="form-group">

					<label for="phone">Phone Number</label> <input type="tel"
						id="phone" name="phone" placeholder="Enter your phone number"
						autocomplete="tel" pattern="[0-9]{10}" maxlength="10"
						minlength="10" title="Please enter a valid 10-digit phone number"
						required>

				</div>

				<!-- Password with eye icon -->
				<div class="form-group">
					<label for="password">Password</label>

					<div class="password-wrapper">
						<input type="password" id="password" name="password"
							placeholder="Create a password" autocomplete="new-password"
							minlength="8" required>

						<button type="button" id="togglePassword" class="toggle-password"
							aria-label="Show password">

							<svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="22"
								height="22" viewBox="0 0 24 24" fill="none"
								stroke="currentColor" stroke-width="2" stroke-linecap="round"
								stroke-linejoin="round">
                <path
									d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" />
                <circle cx="12" cy="12" r="3" />
            </svg>

						</button>
					</div>
				</div>

				<!-- Address -->
				<div class="form-group">

					<label for="address">Address</label>

					<textarea id="address" name="address"
						placeholder="Enter your delivery address"
						autocomplete="street-address" required></textarea>

				</div>

				<!-- Role selection -->
				<div class="form-group">

					<label for="role">Select Role</label> <select id="role" name="role"
						required>

						<option value="" disabled selected>Choose your role</option>

						<option value="CUSTOMER">Customer</option>

						<option value="RESTAURANT_OWNER">Restaurant Owner</option>

						<option value="DELIVERY_PARTNER">Delivery Partner</option>

					</select>

				</div>

				<button type="submit" class="register-btn">Create Account</button>

			</form>

			<p class="login-link">
				Already have an account? <a href="login.html">Login here</a>
			</p>

		</section>

	</main>

	<!-- Footer -->
	<footer>
		Made with <span>♥</span> by FoodieGo | Fresh food, delivered with
		love.
	</footer>

	<script>

/* Display registration error messages */
const params = new URLSearchParams(window.location.search);

const error = params.get("error");

const message = document.getElementById("registerMessage");

if (error === "invalid") {

    message.textContent = "Please fill in all required fields.";

} else if (error === "registration") {

    message.textContent =
        "Registration failed. Check your details and database.";

} else if (error === "server") {

    message.textContent =
        "A server error occurred. Check the Eclipse Console.";

}

/* Show and hide password */
const passwordInput = document.getElementById("password");

const togglePassword = document.getElementById("togglePassword");

const eyeIcon = document.getElementById("eyeIcon");

togglePassword.addEventListener("click", function() {

    if (passwordInput.type === "password") {

        // Show password
        passwordInput.type = "text";

        togglePassword.setAttribute("aria-label", "Hide password");

        togglePassword.setAttribute("aria-pressed", "true");

        // Eye with slash
        eyeIcon.innerHTML = `
            <path d="M3 3l18 18"/>
            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
            <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3 3.8"/>
            <path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.2 3.3-.6"/>
        `;

    } else {

        // Hide password
        passwordInput.type = "password";

        togglePassword.setAttribute("aria-label", "Show password");

        togglePassword.setAttribute("aria-pressed", "false");

        // Normal eye
        eyeIcon.innerHTML = `
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
        `;

    }

});

</script>

</body>
</html>
