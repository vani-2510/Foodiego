```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cart | FoodieGo</title>

<style>
* {
	box-sizing: border-box;
}

body {
	margin: 0;
	font-family: Arial, sans-serif;
	background: #19191f;
	color: white;
}

.navbar {
	padding: 18px 7%;
	background: #222128;
	border-bottom: 1px solid #363640;
	display: flex;
	justify-content: space-between;
	align-items: center;
}

.logo {
	color: #ff386b;
	font-size: 28px;
	font-weight: bold;
	text-decoration: none;
}

.back-link {
	color: #ff7897;
	text-decoration: none;
}

.container {
	max-width: 1100px;
	margin: auto;
	padding: 40px 5%;
}

h1 {
	margin-bottom: 30px;
}

.cart-item {
	display: flex;
	align-items: center;
	gap: 20px;
	padding: 20px;
	margin-bottom: 18px;
	background: #24242d;
	border: 1px solid #363640;
	border-radius: 12px;
}

.cart-item img {
	width: 120px;
	height: 110px;
	object-fit: cover;
	border-radius: 9px;
}

.item-details {
	flex: 1;
	min-width: 0;
}

.item-details h3 {
	margin-top: 0;
}

.item-details p {
	color: #c4c4d0;
}

.price {
	color: #23c982;
	font-weight: bold;
}

.quantity-controls {
	display: flex;
	align-items: center;
	gap: 12px;
	margin-top: 12px;
}

.quantity-controls button {
	width: 32px;
	height: 32px;
	border: none;
	border-radius: 6px;
	background: #ff386b;
	color: white;
	font-size: 18px;
	cursor: pointer;
}

.remove-btn {
	margin-top: 12px;
	padding: 8px 13px;
	background: transparent;
	color: #ff7897;
	border: 1px solid #ff386b;
	border-radius: 6px;
	cursor: pointer;
}

.summary {
	margin-top: 30px;
	padding: 25px;
	background: #24242d;
	border: 1px solid #363640;
	border-radius: 12px;
}

.summary-row {
	display: flex;
	justify-content: space-between;
	margin: 15px 0;
}

.total {
	font-size: 23px;
	font-weight: bold;
	color: #23c982;
}

.checkout-btn {
	width: 100%;
	padding: 15px;
	margin-top: 15px;
	border: none;
	border-radius: 8px;
	background: #ff386b;
	color: white;
	font-size: 16px;
	font-weight: bold;
	cursor: pointer;
}

.checkout-btn:hover {
	background: #e9275b;

.empty-cart {
	padding: 50px 20px;
	text-align: center;
	background: #24242d;

	display: inline-block;

	.cart-item {
		align-items: flex-start;
		flex-wrap: wrap;
	}
	.cart-item img {
		width: 90px;
		height: 90px;
	}
}
</style>
</head>

<body>

	<nav class="navbar">

		<a href="index.jsp" class="logo">FoodieGo</a> <a
			href="callRestaurantServlet" class="back-link"> Continue Shopping
		</a>

	</nav>

	<main class="container">

		<h1>🛒 My Shopping Cart</h1>

		<div id="cartItems"></div>

		<div id="cartSummary" class="summary" style="display: none;">

			<h2>Order Summary</h2>

			<div class="summary-row">
				<span>Total Items</span> <span id="totalItems">0</span>
			</div>

			<div class="summary-row">
				<span>Subtotal</span> <span id="subtotal">₹0.00</span>
			</div>

			<div class="summary-row">
				<span>Delivery Fee</span> <span id="delivery">₹40.00</span>
			</div>

			<hr>

			<div class="summary-row total">
				<span>Total Amount</span> <span id="grandTotal">₹0.00</span>
			</div>

			<button class="checkout-btn" onclick="checkout()">Proceed to
				Checkout</button>

		</div>

	</main>

	<script>

// Get cart items saved from menu.jsp

let cart = JSON.parse(
    sessionStorage.getItem("foodieGoCart") || "[]"
);


// Prevent HTML injection when displaying item details

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}


// Display cart items

function displayCart() {

    const cartItems = document.getElementById("cartItems");
    const summary = document.getElementById("cartSummary");

    cartItems.innerHTML = "";

    if (cart.length === 0) {

        summary.style.display = "none";

        cartItems.innerHTML = <div class="empty-cart">
                <h2>Your cart is empty!</h2>
                <p>Looks like you haven't added any food yet.</p>

                <a href="callRestaurantServlet" class="shop-btn">
                    Explore Restaurants
                </a>
            </div>
        `;

        return;
    }

    summary.style.display = "block";

    let totalItems = 0;
    let subtotal = 0;

    cart.forEach(function(item, index) {

        const quantity = Number(item.quantity) || 0;
        const price = Number(item.price) || 0;

        totalItems += quantity;
        subtotal += price * quantity;

        cartItems.innerHTML += `
            <div class="cart-item">

                <img
                    src="${escapeHtml(item.image)}"
                    alt="${escapeHtml(item.name)}">

                <div class="item-details">

                    <h3>${escapeHtml(item.name)}</h3>

                    <p>Price: ₹${price.toFixed(2)}</p>

                    <div class="quantity-controls">

                        <button onclick="changeQuantity(${index}, -1)">
                            -
                        </button>

                        <span>${quantity}</span>

                        <button onclick="changeQuantity(${index}, 1)">
                            +
                        </button>

                    </div>

                    <p class="price">
                        Total: ₹${(price * quantity).toFixed(2)}
                    </p>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})">
                        Remove
                    </button>

                </div>

            </div>
        `;
    });

    const delivery = 40;

    document.getElementById("totalItems").textContent = totalItems;

    document.getElementById("subtotal").textContent = "₹" + subtotal.toFixed(2);

    document.getElementById("delivery").textContent = "₹" + delivery.toFixed(2);

    document.getElementById("grandTotal").textContent = "₹" + (subtotal + delivery).toFixed(2);
}


// Change item quantity

function changeQuantity(index, amount) {

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart();
}


// Remove an item

function removeItem(index) {

    cart.splice(index, 1);

    saveCart();
}


// Save cart to sessionStorage

function saveCart() {

    sessionStorage.setItem(
        "foodieGoCart",
        JSON.stringify(cart)
    );

    displayCart();
}


// Checkout placeholder

function checkout() {

    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    alert("Your cart is ready. Checkout integration will be added next.");
}


// Load cart when page opens

displayCart();

</script>

</body>
</html>
